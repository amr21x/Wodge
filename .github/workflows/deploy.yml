name: Production Deploy

# Main pushes validate before deploying; documentation-only changes stop after CI.
# Production Worker secrets are managed in Cloudflare and preserved on deployment.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      integration_mode:
        description: Integration configuration (ready requires storage and Polar settings)
        type: choice
        required: true
        default: partial
        options:
          - partial
          - ready

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/quality.yml

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && needs.checks.outputs.application == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_DOMAIN || 'https://wodge.amr21.dev' }}
    env:
      APP_DOMAIN: ${{ vars.APP_DOMAIN || 'https://wodge.amr21.dev' }}
      BACKEND_DOMAIN: ${{ vars.BACKEND_DOMAIN || 'https://wodge.amr21.dev' }}
      AVATARS_URL: ${{ vars.AVATARS_URL || 'https://wodge-avatars.amr21.dev' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check deployment credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing production CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing production CLOUDFLARE_API_TOKEN"; exit 1; }
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build frontend Worker
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_APP_DOMAIN: ${{ env.APP_DOMAIN }}
          NEXT_PUBLIC_BACKEND_DOMAIN: ${{ env.BACKEND_DOMAIN }}
          NEXT_PUBLIC_AVATARS_URL: ${{ env.AVATARS_URL }}
        run: pnpm --filter web workers:build
      # Migrations are forward-only and run before the Worker that depends on them.
      - name: Apply D1 migrations
        run: pnpm --filter backend db:migration:cloud
      - name: Deploy backend Worker
        working-directory: apps/backend
        env:
          INTEGRATION_MODE: ${{ inputs.integration_mode || vars.INTEGRATION_MODE || 'partial' }}
        run: >-
          pnpm exec wrangler deploy
          --var "APP_DOMAIN:$APP_DOMAIN"
          --var "BACKEND_DOMAIN:$BACKEND_DOMAIN"
          --var "AVATARS_URL:$AVATARS_URL"
          --var "INTEGRATION_MODE:$INTEGRATION_MODE"
          --message "$GITHUB_SHA"
      - name: Deploy frontend Worker
        working-directory: apps/web
        run: >-
          pnpm exec opennextjs-cloudflare deploy
      - name: Smoke check
        run: |
          curl -A "Mozilla/5.0 Wodge-deploy" -fsS --retry 5 --retry-delay 5 "$APP_DOMAIN/health"
          curl -A "Mozilla/5.0 Wodge-deploy" -fsS --retry 5 --retry-delay 5 -o /dev/null "$APP_DOMAIN/login"
