name: Backend Worker Deploy

# Production Durable Object namespace mapping must be verified before cutover.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
      - run: pnpm install --frozen-lockfile
      - name: Configure Worker secrets
        working-directory: config/workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BACKEND_SECRETS: ${{ secrets.BACKEND_SECRETS }}
        run: printf '%s' "$BACKEND_SECRETS" | pnpm exec wrangler secret bulk --config ../../apps/backend/wrangler.jsonc
      - name: Deploy Worker
        working-directory: config/workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          BACKEND_DOMAIN: ${{ vars.BACKEND_DOMAIN }}
          AVATARS_URL: ${{ vars.AVATARS_URL }}
        run: >-
          pnpm exec wrangler deploy --config ../../apps/backend/wrangler.jsonc
          --var "APP_DOMAIN:$APP_DOMAIN"
          --var "BACKEND_DOMAIN:$BACKEND_DOMAIN"
          --var "AVATARS_URL:$AVATARS_URL"
