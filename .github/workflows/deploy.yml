name: Production Deploy

# Manually dispatched for a reviewed ref. The `production` GitHub environment holds the
# Cloudflare credentials and backend secrets; add required reviewers to
# it so every run waits for owner approval. See docs/operations/runbooks/production-deployment.md.
on:
  workflow_dispatch:
    inputs:
      integration_mode:
        description: Integration configuration (ready requires storage and Polar settings)
        type: choice
        required: true
        default: partial
        options:
          - partial
          - ready

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/quality.yml
    with:
      deployment: true

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ needs.checks.outputs.app_domain }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: deployment
      - name: Restore validated builds
        run: tar -xzf deployment.tar.gz
      # Migrations are forward-only and run before the Worker that depends on them.
      - name: Apply D1 migrations
        run: pnpm --filter backend db:migration:cloud
      - name: Configure Worker secrets
        working-directory: apps/backend
        env:
          BACKEND_SECRETS: ${{ secrets.BACKEND_SECRETS }}
        run: printf '%s' "$BACKEND_SECRETS" | pnpm exec wrangler secret bulk
      - name: Deploy backend Worker
        working-directory: apps/backend
        env:
          APP_DOMAIN: ${{ needs.checks.outputs.app_domain }}
          BACKEND_DOMAIN: ${{ needs.checks.outputs.backend_domain }}
          AVATARS_URL: ${{ needs.checks.outputs.avatars_url }}
          INTEGRATION_MODE: ${{ inputs.integration_mode }}
        run: >-
          pnpm exec wrangler deploy dist/worker/server.js --no-bundle
          --var "APP_DOMAIN:$APP_DOMAIN"
          --var "BACKEND_DOMAIN:$BACKEND_DOMAIN"
          --var "AVATARS_URL:$AVATARS_URL"
          --var "INTEGRATION_MODE:$INTEGRATION_MODE"
          --message "$GITHUB_SHA"
      - name: Deploy web to Cloudflare Pages
        working-directory: apps/web
        run: >-
          pnpm exec wrangler pages deploy .vercel/output/static
          --project-name wodge --branch main
          --commit-hash "$GITHUB_SHA" --commit-dirty=false
      - name: Smoke check
        env:
          APP_DOMAIN: ${{ needs.checks.outputs.app_domain }}
        run: |
          curl -fsS --retry 5 --retry-delay 5 "$APP_DOMAIN/health"
          curl -fsS --retry 5 --retry-delay 5 -o /dev/null "$APP_DOMAIN/login"
