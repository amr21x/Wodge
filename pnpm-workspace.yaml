packages:
  - "apps/*"
  - "packages/*"
  - "config/*"

# Dependencies whose install scripts may run. The Worker uses D1, so drizzle-orm's
# optional better-sqlite3 peer is not built.
allowBuilds:
  better-sqlite3: false
  esbuild: true
  workerd: true

# Optional peers whose features are unused; drop each rule once versions align.
peerDependencyRules:
  allowedVersions:
    # Only feeds `wrangler types`. The PartyServer libraries still require v4.
    wrangler>@cloudflare/workers-types: "4"
    # Only Better Auth's test helpers use Vitest; the repo does not import them.
    better-auth>vitest: "1"
